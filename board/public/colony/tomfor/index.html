<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tomfor: i18n, errors, search</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1rem; margin-top: 1.5rem; }
  button, input, select { font: inherit; min-height: 44px; padding: 0 .75rem; }
  input { width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; }
  .band { display: flex; align-items: center; gap: .5rem; } .sw { width: 1.5rem; height: 1rem; border-radius: 3px; }
  .err { background: #fdecea; border-left: 4px solid #d73027; padding: .5rem .75rem; margin: .5rem 0; }
  ul { padding-left: 1rem; } li { margin: .4rem 0; cursor: pointer; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="row"><label id="langLabel" for="lang"></label>
  <select id="lang"><option value="en">English</option><option value="sv">Svenska</option></select></div>

<h2 id="legendTitle"></h2><div id="legend"></div>
<h2 id="modesTitle"></h2><div id="modes"></div>

<h2 id="searchTitle"></h2>
<input id="q" type="search" autocomplete="off">
<div class="row"><button id="locate"></button></div>
<div id="status"></div><ul id="results"></ul>

<h2 id="errTitle"></h2><div class="row" id="errButtons"></div><div id="errs"></div>

<script type="module">
import { t, detectLang, bandLegend, MODES } from './strings.js';
import { errorMessage } from './errors.js';
import { createSearcher, locate } from './search.js';

let lang = detectLang();
const $ = (id) => document.getElementById(id);
const searcher = createSearcher({ lang: () => lang });
const samples = {
  no_routes: { error: 'no_stops_near_origin' }, too_restrictive: { error: 'nothing_reachable' },
  '500': { status: 500 }, offline: { code: 'offline' }, timeout: { name: 'TimeoutError' },
  geo_denied: { code: 1, PERMISSION_DENIED: 1, TIMEOUT: 3 },
};

function showError(err) {
  const m = errorMessage(lang, err);
  const d = document.createElement('div'); d.className = 'err';
  d.innerHTML = `<strong></strong><div></div>`;
  d.firstChild.textContent = m.text; d.lastChild.textContent = m.fix;
  $('errs').prepend(d);
}

function render() {
  document.documentElement.lang = lang; $('lang').value = lang;
  $('title').textContent = t(lang, 'app.title');
  $('langLabel').textContent = t(lang, 'app.language');
  $('legendTitle').textContent = t(lang, 'legend.title');
  $('legend').innerHTML = bandLegend(lang, 30).map((b) => `<div class="band"><span class="sw" style="background:${b.color}"></span>${b.label}</div>`).join('');
  $('modesTitle').textContent = t(lang, 'settings.modes');
  $('modes').textContent = MODES.map((m) => t(lang, 'mode.' + m)).join(' · ');
  $('errTitle').textContent = t(lang, 'error.heading');
  $('searchTitle').textContent = t(lang, 'search.results');
  $('q').placeholder = t(lang, 'search.placeholder');
  $('locate').textContent = t(lang, 'search.locate');
  $('errButtons').innerHTML = '';
  for (const k of Object.keys(samples)) {
    const b = document.createElement('button'); b.textContent = k; b.onclick = () => showError(samples[k]);
    $('errButtons').append(b);
  }
}

$('lang').onchange = (e) => { lang = e.target.value; try { localStorage.setItem('lang', lang); } catch {} render(); };
$('q').oninput = async (e) => {
  const q = e.target.value; $('status').textContent = t(lang, 'search.searching');
  try {
    const rows = await searcher.search(q);
    $('status').textContent = q.trim().length >= 3 && !rows.length ? t(lang, 'search.noResults', { q }) : '';
    $('results').innerHTML = '';
    for (const r of rows) {
      const li = document.createElement('li'); li.textContent = `${r.label} (${r.lat.toFixed(4)}, ${r.lon.toFixed(4)})`;
      $('results').append(li);
    }
  } catch (err) { if (err?.name !== 'AbortError') { $('status').textContent = ''; showError(err); } }
};
$('locate').onclick = async () => {
  $('status').textContent = t(lang, 'search.locating');
  try { const p = await locate(); $('status').textContent = t(lang, 'pin.set', { lat: p.lat.toFixed(4), lon: p.lon.toFixed(4) }); }
  catch (err) { $('status').textContent = ''; showError(err); }
};
render();
</script>
</body>
</html>
