<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="colony" content="group-app">
<title>Stockholm isochrone map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map"></div>

<aside id="panel" class="panel">
  <button id="sheet-toggle" class="sheet-toggle" type="button" aria-expanded="true" aria-label="Toggle settings">
    <span class="grip"></span>
  </button>

  <header class="panel-head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="#7a2cbf"/>
        <circle cx="16" cy="16" r="11" fill="#e0359b"/>
        <circle cx="16" cy="16" r="8" fill="#ff9a1f"/>
        <circle cx="16" cy="16" r="5" fill="#7ddc3b"/>
        <circle cx="16" cy="16" r="2" fill="#fff"/>
      </svg>
      <h1 data-i18n="title">Stockholm isochrone map</h1>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="sv">SV</button>
    </div>
  </header>

  <form id="form" novalidate>
    <div class="origin-card">
      <svg viewBox="0 0 24 24" class="origin-icon" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg>
      <div>
        <div class="origin-label"><span data-i18n="origin">Origin</span>: <output id="origin-out">–</output></div>
        <div class="hint" data-i18n="hint">Tap the map or drag the pin to set the origin.</div>
      </div>
    </div>

    <p id="banner" class="banner" data-i18n="warn.fixture" hidden></p>
    <p id="summary" class="sr-only" role="status" aria-live="polite"></p>
    <p id="feed-warn" class="banner" role="status" hidden></p>

    <label class="field">
      <span class="label" data-i18n="startTime">Start time</span>
      <input type="datetime-local" id="start-time" required>
    </label>
    <label class="check">
      <input type="checkbox" id="arrive-by">
      <span data-i18n="arriveBy">Arrive by this time (where could I leave from?)</span>
    </label>

    <div class="field">
      <div class="label-row">
        <label class="label" for="max-travel" data-i18n="maxTravel">Max travel time</label>
        <output id="travel-out" class="travel-out" for="max-travel">30 min</output>
      </div>
      <input type="range" id="max-travel" min="5" max="120" step="5" value="30">
      <div class="range-scale" aria-hidden="true"><span>5</span><span>60</span><span>120</span></div>
    </div>

    <details class="more" open>
      <summary data-i18n="sec.limits">Waiting &amp; walking</summary>
      <div class="grid">
        <label class="field">
          <span class="label" data-i18n="maxWait">Max wait (min)</span>
          <input type="number" id="max-wait" inputmode="numeric" min="0" max="60" step="1" value="7">
        </label>
        <label class="field">
          <span class="label" data-i18n="maxTransfers">Max connections</span>
          <input type="number" id="max-transfers" inputmode="numeric" min="0" max="8" step="1" value="3">
        </label>
        <label class="field">
          <span class="label" data-i18n="walkDest">Walk to destination (min)</span>
          <input type="number" id="walk-dest" inputmode="numeric" min="0" max="30" step="1" value="10">
        </label>
        <label class="field">
          <span class="label" data-i18n="walkTransfer">Walk between stops (min)</span>
          <input type="number" id="walk-transfer" inputmode="numeric" min="0" max="30" step="1" value="5">
        </label>
      </div>
    </details>

    <fieldset class="modes">
      <legend class="label" data-i18n="modes">Transport types</legend>
      <div id="modes" class="chips"></div>
      <p class="hint" data-i18n="walkOnlyHint">Turn all off to see walking only.</p>
    </fieldset>

    <div class="actions">
      <button id="update" class="primary" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span data-i18n="update">Update</span>
      </button>
      <button id="reset-map" class="secondary" type="button" data-i18n="reset">Reset</button>
    </div>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="legend" class="legend" hidden></div>
  <p id="journey-hint" class="journey-hint" hidden></p>
  <div id="walk-note" class="walk-note" hidden><span class="walk-swatch" aria-hidden="true"></span><span id="walk-text"></span></div>
</aside>

<aside id="journey-panel" class="panel journey-panel" aria-live="polite" hidden>
  <button id="journey-close" class="journey-close" type="button" data-i18n-aria="close" aria-label="Close">&times;</button>
  <div id="journey-body"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/colony/vijay-team/isochrone-summary.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
