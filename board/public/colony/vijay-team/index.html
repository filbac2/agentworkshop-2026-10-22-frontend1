<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vijay-team: SL transit data explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; z-index: 1000; top: 10px; right: 10px; background: #fffe; padding: 10px 12px; border-radius: 8px; box-shadow: 0 1px 6px #0004; max-width: 220px; }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  label { display: block; margin: 2px 0; cursor: pointer; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  select { margin: 4px 0 6px; width: 100%; }
  #info { margin-top: 6px; color: #444; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>SL transit data</h1>
  <a href="/colony/vijay-team/sync.html">Live team sync</a> · <a href="/colony/vijay-team/status.html">Group app health</a>
  <select id="day">
    <option value="weekday">Weekday</option>
    <option value="saturday">Saturday</option>
    <option value="sunday">Sunday</option>
  </select>
  <div id="modes"></div>
  <label><input type="checkbox" id="lines" checked> Show lines (not bus)</label>
  <div id="info">Loading...</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MODES = {
  metro: '#0a6fd6', commuter_rail: '#e0457b', train: '#8a4fd3',
  tram: '#1e9e55', boat: '#12a5b5', bus: '#e08a00',
};
const API = '/t/vijay-team';
const map = L.map('map', { preferCanvas: true }).setView([59.3293, 18.0686], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const layer = L.layerGroup().addTo(map);
const lineLayer = L.layerGroup().addTo(map);
const lineFeatures = [];
const modesEl = document.getElementById('modes');
const info = document.getElementById('info');
const dayEl = document.getElementById('day');
const enabled = new Set(Object.keys(MODES));
let stops = [];

for (const m of Object.keys(MODES)) {
  const l = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = true;
  cb.addEventListener('change', () => { cb.checked ? enabled.add(m) : enabled.delete(m); draw(); drawLines(); });
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = MODES[m];
  l.append(cb, dot, m.replace('_', ' '));
  modesEl.append(l);
}

function draw() {
  layer.clearLayers();
  let n = 0;
  for (const s of stops) {
    const mode = ['metro', 'commuter_rail', 'train', 'tram', 'boat', 'bus'].find((m) => s.modes.includes(m) && enabled.has(m));
    if (!mode) continue;
    n++;
    L.circleMarker([s.lat, s.lon], { radius: mode === 'bus' ? 3 : 5, color: MODES[mode], weight: 1, fillOpacity: 0.7 })
      .bindTooltip(Object.assign(document.createElement('span'), { textContent: s.name + ' (' + s.modes.join(', ') + ')' }))
      .addTo(layer);
  }
  info.textContent = n + ' of ' + stops.length + ' stations shown';
}

const linesEl = document.getElementById('lines');
function drawLines() {
  lineLayer.clearLayers();
  if (!linesEl.checked) return;
  for (const f of lineFeatures) {
    if (!enabled.has(f.properties.mode)) continue;
    L.geoJSON(f, { style: { color: MODES[f.properties.mode], weight: 3, opacity: 0.6 }, interactive: false }).addTo(lineLayer);
  }
}
async function loadLines() {
  try {
    const routes = await (await fetch(API + '/routes')).json();
    const wanted = routes.filter((r) => r.mode !== 'bus');
    const feats = await Promise.all(wanted.map((r) =>
      fetch(API + '/shape/' + r.mode + '/' + encodeURIComponent(r.name)).then((x) => (x.ok ? x.json() : null)).catch(() => null)));
    lineFeatures.push(...feats.filter(Boolean));
    drawLines();
  } catch (e) { /* lines are optional */ }
}
linesEl.addEventListener('change', drawLines);

async function load() {
  info.textContent = 'Loading...';
  try {
    const r = await fetch(API + '/stops?day=' + dayEl.value);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    stops = await r.json();
    draw();
  } catch (e) {
    info.textContent = 'Could not load data: ' + e.message;
  }
}
dayEl.addEventListener('change', load);
load();
loadLines();
</script>
</body>
</html>
